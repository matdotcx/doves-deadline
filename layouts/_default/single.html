{{ define "main" }}
<article class="post single-post">
    <div class="title-block">
        <h1 class="post-title">{{ .Title }}</h1>
        {{ partial "edition-counter.html" . }}
    </div>

    <div class="post-content">
        {{ $content := .Content }}
        {{ $content := replaceRE `<section class="footnotes[^>]*>` `<div class="footnotes">` $content }}
        {{ $content := replaceRE `</section>` `</div>` $content }}
        {{ $content | safeHTML }}
    </div>
</article>
{{ end }}
